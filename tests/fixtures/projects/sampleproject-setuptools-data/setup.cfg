#
# Metadata for the sampleproject-setuptools-data fixture -- exercises
# package_data + include_package_data + MANIFEST.in wheel file
# discovery (tests/core/models_wheel/test_models_wheel_setuptools.py).

[metadata]
name = sampleproject_setuptools_data
version = 0.1.0
description = A minimal sample project for testing setuptools package_data/MANIFEST.in file discovery.
author = Pitloom CI
author_email = ci@loom.example
license = CC0-1.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
sampleproject_setuptools_data = *.json
