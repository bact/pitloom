name: "Pitloom - SBOM generator for AI models and Python projects"
description: >-
  Generate SPDX 3 SBOMs for Python projects and AI models using Pitloom.
author: "Arthit Suriyawongkul"

branding:
  icon: "package"
  color: "purple"

inputs:
  project-path:
    description: >-
      Directory to scan for a Python project (containing pyproject.toml,
      setup.cfg, or setup.py). Ignored when "model" is set.
    required: false
    default: "."
  embed-wheel:
    description: >-
      Path or glob pattern of built wheel file(s) to embed the generated
      SBOM into (PEP 770). Example: "dist/*.whl". When set, runs
      "loom embed-wheel <embed-wheel>" instead of project/model mode.
    required: false
    default: ""
  model:
    description: >-
      Path to a local AI model file, or a Hugging Face URL / model ID.
      When set, runs model mode ("loom model <model>") instead of project mode.
    required: false
    default: ""
  output:
    description: >-
      SBOM output file path. Empty (default) lets "loom" apply its own
      default naming for the resolved mode: project mode uses
      packagename-version.spdx3.json (falling back to packagename.spdx3.json,
      then sbom.spdx3.json as a last resort, unless overridden by the
      project's [tool.pitloom] sbom-basename); model mode names the file
      after the model's own filename or Hugging Face repo ID; embed-wheel
      mode reuses the name it embeds into the wheel.
    required: false
    default: ""
  extras:
    description: >-
      Comma-separated pip extras to install alongside Pitloom, e.g. "ai"
      (all AI model formats, including Hugging Face Hub support).
    required: false
    default: ""
  pretty:
    description: "Pretty-print the SBOM output with 2-space indentation."
    required: false
    default: "false"
  enrich:
    description: >-
      Run local README/model-card enrichment ("true"/"false"). Empty
      (default) defers to the project's [tool.pitloom] enrich config,
      which is off by default.
    required: false
    default: ""
  extract-file-header:
    description: >-
      Scan each source file's SPDX-File* header tags ("true"/"false").
      Empty (default) defers to the project's [tool.pitloom]
      extract-file-header config, which is on by default.
    required: false
    default: ""
  content-type:
    description: >-
      Detect each file's content type via magika/an extension guess ("true"/"false").
      Empty (default) defers to [tool.pitloom.content-type] enabled,
      which is off by default -- turn on deliberately, not reflexively,
      given the per-file cost.
    required: false
    default: ""
  content-type-method:
    description: >-
      Which detector resolves content-type's values: "auto" (try magika,
      fall back to a filename-extension guess), "magika" (same, but error
      immediately if the magika package isn't installed), or "extension"
      (skip magika entirely, stdlib-only). Empty (default) defers to
      [tool.pitloom.content-type] method, which is "auto" by default.
    required: false
    default: ""
  args:
    description: "Extra raw flags passed through to the loom command."
    required: false
    default: ""
  pitloom-version:
    description: >-
      Pitloom version or version specifier to install, e.g. "0.16.4" or
      ">=0.13,<1.0". Empty installs the latest release from PyPI.
    required: false
    default: ""
  python-version:
    description: "Python version passed to actions/setup-python."
    required: false
    default: "3.x"
  install:
    description: >-
      When "false", skip installing Python and Pitloom, and assume Pitloom
      is already available on PATH (used by Pitloom's own self-test to
      dogfood the local checkout via "uses: ./").
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the generated SBOM using actions/upload-artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Artifact name used when upload-artifact is true."
    required: false
    default: "sbom"

outputs:
  sbom-path:
    description: "Path to the generated SBOM file."
    value: ${{ steps.generate.outputs.sbom-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: inputs.install == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Pitloom
      if: inputs.install == 'true'
      shell: bash
      env:
        PL_EXTRAS: ${{ inputs.extras }}
        PL_VERSION: ${{ inputs.pitloom-version }}
      run: |
        set -euo pipefail

        spec="pitloom"
        if [ -n "${PL_EXTRAS}" ]; then
          spec="${spec}[${PL_EXTRAS}]"
        fi
        if [ -n "${PL_VERSION}" ]; then
          # pitloom-version accepts either a bare version ("0.16.4") or a
          # full specifier (">=0.13,<1.0"). A leading comparison operator
          # means it is already a specifier; only bare versions need "=="
          # inserted, otherwise "pitloom==>=0.13,<1.0" is invalid.
          case "${PL_VERSION}" in
            [\<\>=!~]*) spec="${spec}${PL_VERSION}" ;;
            *) spec="${spec}==${PL_VERSION}" ;;
          esac
        fi

        python -m pip install --upgrade pip
        pip install "${spec}"

    - name: Generate SBOM
      id: generate
      shell: bash
      env:
        PL_PROJECT_PATH: ${{ inputs.project-path }}
        PL_EMBED_WHEEL: ${{ inputs.embed-wheel }}
        PL_MODEL: ${{ inputs.model }}
        PL_OUTPUT: ${{ inputs.output }}
        PL_PRETTY: ${{ inputs.pretty }}
        PL_ENRICH: ${{ inputs.enrich }}
        PL_EXTRACT_FILE_HEADER: ${{ inputs.extract-file-header }}
        PL_CONTENT_TYPE: ${{ inputs.content-type }}
        PL_CONTENT_TYPE_METHOD: ${{ inputs.content-type-method }}
        PL_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        # Resolve a python binary up front -- used both for the embed-wheel
        # match count below and for the PL_ARGS shlex split further down.
        # When install=false, "Set up Python" is skipped, so don't assume
        # python3 specifically is on PATH.
        python_bin=python3
        command -v "${python_bin}" >/dev/null 2>&1 || python_bin=python

        declare -a loom_args
        is_embed=false
        if [ -n "${PL_EMBED_WHEEL}" ]; then
          is_embed=true
          loom_args+=("embed-wheel" "${PL_EMBED_WHEEL}")
          if [ -n "${PL_PROJECT_PATH}" ]; then
            loom_args+=("--project-dir" "${PL_PROJECT_PATH}")
          fi
        elif [ -n "${PL_MODEL}" ]; then
          loom_args+=("model" "${PL_MODEL}")
        else
          loom_args+=("project" "${PL_PROJECT_PATH}")
        fi

        # "loom embed-wheel" rejects --output when its pattern matches more
        # than one wheel (a standalone copy is ambiguous across wheels), so
        # mirror that check here rather than crash: only pass -o (and later
        # report sbom-path) when the pattern resolves to exactly one wheel.
        skip_output=false
        if [ "${is_embed}" = true ]; then
          wheel_count=$(
            "${python_bin}" -c 'import glob, sys; print(len(glob.glob(sys.argv[1])))' \
              "${PL_EMBED_WHEEL}"
          )
          if [ "${wheel_count}" -ne 1 ]; then
            skip_output=true
          fi
        fi
        # An explicit "output" input always wins. Otherwise leave -o off and
        # let "loom" apply its own default-naming logic (packagename-version,
        # falling back to packagename, then "sbom" as a last resort -- see
        # pitloom.cli.options._resolve_output_path and
        # pitloom._embed_wheel._derive_wheel_sbom_filename) rather than
        # forcing a generic "sbom.spdx3.json" here.
        if [ "${skip_output}" = false ] && [ -n "${PL_OUTPUT}" ]; then
          loom_args+=("-o" "${PL_OUTPUT}")
        fi

        if [ "${PL_PRETTY}" = "true" ]; then
          loom_args+=("--pretty")
        fi
        if [ "${PL_ENRICH}" = "true" ]; then
          loom_args+=("--enrich")
        elif [ "${PL_ENRICH}" = "false" ]; then
          loom_args+=("--no-enrich")
        fi
        if [ "${PL_EXTRACT_FILE_HEADER}" = "true" ]; then
          loom_args+=("--extract-file-header")
        elif [ "${PL_EXTRACT_FILE_HEADER}" = "false" ]; then
          loom_args+=("--no-extract-file-header")
        fi
        if [ "${PL_CONTENT_TYPE}" = "true" ]; then
          loom_args+=("--content-type")
        elif [ "${PL_CONTENT_TYPE}" = "false" ]; then
          loom_args+=("--no-content-type")
        fi
        if [ -n "${PL_CONTENT_TYPE_METHOD}" ]; then
          loom_args+=("--content-type-method" "${PL_CONTENT_TYPE_METHOD}")
        fi
        if [ -n "${PL_ARGS}" ]; then
          # Quote-aware split: PL_ARGS is a shell-like list of extra flags
          # (e.g. '--creator-name "CI Bot"'), not a single token. Plain bash
          # word-splitting (extra_args=(${PL_ARGS})) has no quote-awareness
          # and would break a quoted multi-word value into separate tokens,
          # so split it with Python's shlex instead. (python_bin was
          # resolved above.)
          readarray -t extra_args < <(
            "${python_bin}" -c 'import shlex, sys; print(*shlex.split(sys.argv[1]), sep="\n")' \
              "${PL_ARGS}"
          )
          loom_args+=("${extra_args[@]}")
        fi

        # Capture stdout (while still echoing it to the log) so a
        # loom-picked default filename can be recovered below when
        # "output" was left empty.
        loom_stdout=$(loom "${loom_args[@]}" | tee /dev/stderr)

        if [ "${skip_output}" = false ]; then
          if [ -n "${PL_OUTPUT}" ]; then
            sbom_path="${PL_OUTPUT}"
          elif [ "${is_embed}" = true ]; then
            # "loom embed-wheel" doesn't write a standalone copy unless -o is
            # given (only the wheel's embedded copy, named via
            # _derive_wheel_sbom_filename); extract that copy to disk so the
            # action can still surface a sbom-path and upload it.
            embed_wheel_path=$(
              "${python_bin}" -c 'import glob, sys; print(glob.glob(sys.argv[1])[0])' \
                "${PL_EMBED_WHEEL}"
            )
            arcname=$(
              printf '%s\n' "${loom_stdout}" \
                | sed -n 's/^pitloom: embedded \(.*\) into .*$/\1/p' | head -n1
            )
            sbom_path=$(basename "${arcname}")
            "${python_bin}" -c 'import sys, zipfile; wp, an, op = sys.argv[1:4]; zf = zipfile.ZipFile(wp); data = zf.read(an); zf.close(); out = open(op, "wb"); out.write(data); out.close()' \
              "${embed_wheel_path}" "${arcname}" "${sbom_path}"
          else
            # "loom project"/"loom model" print their resolved default path
            # (see pitloom.cli.commands.utils._print_sbom_output_path).
            sbom_path=$(
              printf '%s\n' "${loom_stdout}" \
                | sed -n 's/^PITLOOM_SBOM_OUTPUT_PATH=//p' | head -n1
            )
          fi
          echo "sbom-path=${sbom_path}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Upload SBOM artifact
      if: inputs.upload-artifact == 'true' && steps.generate.outputs.sbom-path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.generate.outputs.sbom-path }}
