name: "Pitloom - SBOM generator for AI models and Python projects"
description: >-
  Generate SPDX 3 SBOMs for Python projects and AI models using Pitloom.
author: "Arthit Suriyawongkul"

branding:
  icon: "package"
  color: "purple"

inputs:
  project-path:
    description: >-
      Directory to scan for a Python project (containing pyproject.toml,
      setup.cfg, or setup.py). Ignored when "model" is set.
    required: false
    default: "."
  embed-wheel:
    description: >-
      Path or glob pattern of built wheel file(s) to embed the generated
      SBOM into (PEP 770). Example: "dist/*.whl". When set, runs
      "loom embed-wheel <embed-wheel>" instead of project/model mode.
    required: false
    default: ""
  model:
    description: >-
      Path to a local AI model file, or a Hugging Face URL / model ID.
      When set, runs model mode ("loom model <model>") instead of project mode.
    required: false
    default: ""
  output:
    description: >-
      SBOM output file path. Empty (default) lets "loom" apply its own
      default naming for the resolved mode: project mode uses
      packagename-version.spdx3.json (falling back to packagename.spdx3.json,
      then sbom.spdx3.json as a last resort, unless overridden by the
      project's [tool.pitloom] sbom-basename); model mode names the file
      after the model's own filename or Hugging Face repo ID; embed-wheel
      mode reuses the name it embeds into the wheel.
    required: false
    default: ""
  extras:
    description: >-
      Comma-separated pip extras to install alongside Pitloom, e.g. "ai"
      (all AI model formats, including Hugging Face Hub support).
    required: false
    default: ""
  pretty:
    description: "Pretty-print the SBOM output with 2-space indentation."
    required: false
    default: "false"
  enrich:
    description: >-
      Run local README/model-card enrichment ("true"/"false"). Empty
      (default) defers to the project's [tool.pitloom] enrich config,
      which is off by default.
    required: false
    default: ""
  extract-file-header:
    description: >-
      Scan each source file's SPDX-File* header tags ("true"/"false").
      Empty (default) defers to the project's [tool.pitloom]
      extract-file-header config, which is on by default.
    required: false
    default: ""
  content-type:
    description: >-
      Detect each file's content type via magika/an extension guess ("true"/"false").
      Empty (default) defers to [tool.pitloom.content-type] enabled,
      which is off by default -- turn on deliberately, not reflexively,
      given the per-file cost.
    required: false
    default: ""
  content-type-method:
    description: >-
      Which detector resolves content-type's values: "auto" (try magika,
      fall back to a filename-extension guess), "magika" (same, but error
      immediately if the magika package isn't installed), or "extension"
      (skip magika entirely, stdlib-only). Empty (default) defers to
      [tool.pitloom.content-type] method, which is "auto" by default.
    required: false
    default: ""
  max-source-metadata-bytes:
    description: >-
      Cap the artifact-metadata preservation Annotation's serialized size
      to this many UTF-8 bytes; truncates the largest metadata entries
      first when exceeded. Empty (default) defers to
      [tool.pitloom.provenance] max-source-metadata-bytes, which is 0
      (unbounded) by default.
    required: false
    default: ""
  offline:
    description: >-
      Forbid network access ("true"/"false"). Empty (default) defers to
      the project's [tool.pitloom] offline config, which is off by default.
    required: false
    default: ""
  use-lockfile:
    description: >-
      Resolve exact versions from a lock/pin file cascade ("true"/"false").
      Empty (default) defers to the project's [tool.pitloom] use-lockfile
      config, which is on by default.
    required: false
    default: ""
  allow-build:
    description: >-
      SECURITY: allow Pitloom to invoke the scanned project's own PEP 517
      build backend (subprocess; may install build-requires from the
      network) to discover a wheel's real file list, when static
      discovery has no module for the backend or that backend's own
      static discovery fails ("true"/"false"). Executes third-party
      build-time code from the project being scanned -- only enable this
      for a project whose build script you trust. Unlike every other
      flag above, this has no [tool.pitloom] config-file equivalent and
      is never silently enabled; the default here is "false", not empty
      string, to match that -- there is no config layer to defer to.
    required: false
    default: "false"
  no-build-isolation:
    description: >-
      With allow-build, skip creating an isolated build environment and
      use the current runner's already-installed build backend instead
      ("true"/"false"). No effect without allow-build.
    required: false
    default: "false"
  build-timeout:
    description: >-
      Seconds or h/m/s duration, e.g. 900 or 1h30m. Empty uses Pitloom's
      default of 20m. No effect without allow-build.
    required: false
    default: ""
  args:
    description: "Extra raw flags passed through to the loom command."
    required: false
    default: ""
  pitloom-version:
    description: >-
      Pitloom version or version specifier to install, e.g. "0.19.0" or
      ">=0.19,<1.0". Empty (default) installs the version of the ref this
      action is pinned to; fails if that version is not on PyPI.
    required: false
    default: ""
  python-version:
    description: >-
      Python version passed to actions/setup-python. Empty (default) uses
      the Python on PATH, falling back to setup-python "3.x" with a warning
      if it is unusable.
    required: false
    default: ""
  install:
    description: >-
      When "false", skip installing Python and Pitloom, and assume Pitloom
      is already available on PATH (used by Pitloom's own self-test to
      dogfood the local checkout via "uses: ./").
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the generated SBOM using actions/upload-artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Artifact name used when upload-artifact is true."
    required: false
    default: "sbom"

outputs:
  sbom-path:
    description: "Path to the generated SBOM file."
    value: ${{ steps.generate.outputs.sbom-path }}

runs:
  using: "composite"
  steps:
    - name: Check workflow Python
      id: python
      if: inputs.install == 'true' && inputs.python-version == ''
      shell: bash
      run: |
        set -euo pipefail

        # Forward slashes: safe for bash and native Python on Windows.
        action_path="${GITHUB_ACTION_PATH//\\//}"
        . "${action_path}/scripts/action/python-resolve.sh"
        usable=false
        reason="no working python found on PATH"
        if [ -n "${python_bin}" ]; then
          # A probe crash leaves reason empty; either way, "not usable".
          if reason=$(python_text "${action_path}/scripts/action/python_probe.py"); then
            usable=true
          fi
        fi
        if [ "${usable}" = false ]; then
          echo "::warning::Python on PATH is not usable (${reason:-probe failed}); installing 3.x via setup-python, which changes PATH. Set python-version to choose"
        fi
        echo "usable=${usable}" >> "${GITHUB_OUTPUT}"

    - name: Set up Python
      if: >-
        inputs.install == 'true' &&
        (inputs.python-version != '' || steps.python.outputs.usable == 'false')
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
      with:
        python-version: ${{ inputs.python-version || '3.x' }}

    - name: Install Pitloom
      if: inputs.install == 'true'
      shell: bash
      env:
        PL_EXTRAS: ${{ inputs.extras }}
        PL_VERSION: ${{ inputs.pitloom-version }}
      run: bash "${GITHUB_ACTION_PATH//\\//}/scripts/action/pitloom-install.sh"

    - name: Generate SBOM
      id: generate
      shell: bash
      env:
        PL_PROJECT_PATH: ${{ inputs.project-path }}
        PL_EMBED_WHEEL: ${{ inputs.embed-wheel }}
        PL_MODEL: ${{ inputs.model }}
        PL_OUTPUT: ${{ inputs.output }}
        PL_PRETTY: ${{ inputs.pretty }}
        PL_ENRICH: ${{ inputs.enrich }}
        PL_EXTRACT_FILE_HEADER: ${{ inputs.extract-file-header }}
        PL_CONTENT_TYPE: ${{ inputs.content-type }}
        PL_CONTENT_TYPE_METHOD: ${{ inputs.content-type-method }}
        PL_MAX_SOURCE_METADATA_BYTES: ${{ inputs.max-source-metadata-bytes }}
        PL_OFFLINE: ${{ inputs.offline }}
        PL_USE_LOCKFILE: ${{ inputs.use-lockfile }}
        PL_ALLOW_BUILD: ${{ inputs.allow-build }}
        PL_NO_BUILD_ISOLATION: ${{ inputs.no-build-isolation }}
        PL_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        PL_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        # python_bin/python_text: used by the embed-wheel steps below and
        # the PL_ARGS shlex split; only those paths require a python.
        . "${GITHUB_ACTION_PATH//\\//}/scripts/action/python-resolve.sh"

        declare -a loom_args
        is_embed=false
        if [ -n "${PL_EMBED_WHEEL}" ]; then
          is_embed=true
          loom_args+=("embed-wheel" "${PL_EMBED_WHEEL}")
          if [ -n "${PL_PROJECT_PATH}" ]; then
            loom_args+=("--project-dir" "${PL_PROJECT_PATH}")
          fi
        elif [ -n "${PL_MODEL}" ]; then
          loom_args+=("model" "${PL_MODEL}")
        else
          loom_args+=("project" "${PL_PROJECT_PATH}")
        fi

        # "loom embed-wheel" rejects --output when its pattern matches more
        # than one wheel (a standalone copy is ambiguous across wheels), so
        # mirror that check here rather than crash: only pass -o (and later
        # report sbom-path) when the pattern resolves to exactly one wheel.
        skip_output=false
        if [ "${is_embed}" = true ]; then
          require_python
          wheel_count=$(
            python_text -c 'import glob, sys; print(len(glob.glob(sys.argv[1])))' \
              "${PL_EMBED_WHEEL}"
          )
          if [ "${wheel_count}" -ne 1 ]; then
            skip_output=true
            if [ -n "${PL_OUTPUT}" ]; then
              echo "::warning::embed-wheel matches ${wheel_count} wheels; ignoring output and not reporting sbom-path"
            fi
          fi
        fi
        # An explicit "output" input always wins. Otherwise leave -o off and
        # let "loom" apply its own default-naming logic (packagename-version,
        # falling back to packagename, then "sbom" as a last resort -- see
        # pitloom.cli.options._resolve_output_path and
        # pitloom._embed_wheel._derive_wheel_sbom_filename) rather than
        # forcing a generic "sbom.spdx3.json" here.
        if [ "${skip_output}" = false ] && [ -n "${PL_OUTPUT}" ]; then
          loom_args+=("-o" "${PL_OUTPUT}")
        fi

        if [ "${PL_PRETTY}" = "true" ]; then
          loom_args+=("--pretty")
        fi
        if [ "${PL_ENRICH}" = "true" ]; then
          loom_args+=("--enrich")
        elif [ "${PL_ENRICH}" = "false" ]; then
          loom_args+=("--no-enrich")
        fi
        if [ "${PL_EXTRACT_FILE_HEADER}" = "true" ]; then
          loom_args+=("--extract-file-header")
        elif [ "${PL_EXTRACT_FILE_HEADER}" = "false" ]; then
          loom_args+=("--no-extract-file-header")
        fi
        if [ "${PL_CONTENT_TYPE}" = "true" ]; then
          loom_args+=("--content-type")
        elif [ "${PL_CONTENT_TYPE}" = "false" ]; then
          loom_args+=("--no-content-type")
        fi
        if [ -n "${PL_CONTENT_TYPE_METHOD}" ]; then
          loom_args+=("--content-type-method" "${PL_CONTENT_TYPE_METHOD}")
        fi
        if [ -n "${PL_MAX_SOURCE_METADATA_BYTES}" ]; then
          loom_args+=("--max-source-metadata-bytes" "${PL_MAX_SOURCE_METADATA_BYTES}")
        fi
        if [ "${PL_OFFLINE}" = "true" ]; then
          loom_args+=("--offline")
        elif [ "${PL_OFFLINE}" = "false" ]; then
          loom_args+=("--no-offline")
        fi
        # "--use-lockfile"/"--no-use-lockfile" only exists on "loom project"
        # (not "loom model"/"loom embed-wheel"), since only project mode
        # reads a lock/pin file cascade at all.
        if [ "${is_embed}" = false ] && [ -z "${PL_MODEL}" ]; then
          if [ "${PL_USE_LOCKFILE}" = "true" ]; then
            loom_args+=("--use-lockfile")
          elif [ "${PL_USE_LOCKFILE}" = "false" ]; then
            loom_args+=("--no-use-lockfile")
          fi
        fi
        # "--allow-build"/"--no-build-isolation"/"--build-timeout" exist
        # on both "loom project" and "loom embed-wheel" (both rescan a
        # project directory via get_wheel_files()), but not "loom model"
        # (no project-dir file discovery there). The build-timeout input
        # is passed through verbatim -- parse_build_timeout() in
        # pitloom.core._models_wheel_types is the single duration parser;
        # this script never validates or converts the value itself.
        if [ -z "${PL_MODEL}" ]; then
          if [ "${PL_ALLOW_BUILD}" = "true" ]; then
            loom_args+=("--allow-build")
          fi
          if [ "${PL_NO_BUILD_ISOLATION}" = "true" ]; then
            loom_args+=("--no-build-isolation")
          fi
          if [ -n "${PL_BUILD_TIMEOUT}" ]; then
            loom_args+=("--build-timeout" "${PL_BUILD_TIMEOUT}")
          fi
        else
          # Model mode has no project-dir file discovery, so these three
          # inputs would silently do nothing -- warn once per
          # explicitly-set one instead of dropping it quietly ("no
          # silent deviations", see CLAUDE.md), matching how Pitloom's
          # own BuildOptions warns for the same "given but has no
          # effect" case on every other surface. Never passed to
          # "loom model" itself. Duration parsing is still never done in
          # shell here -- only a non-empty check, same as above.
          if [ "${PL_ALLOW_BUILD}" = "true" ]; then
            echo "::warning::allow-build has no effect in model mode (no project-directory file discovery there)"
          fi
          if [ "${PL_NO_BUILD_ISOLATION}" = "true" ]; then
            echo "::warning::no-build-isolation has no effect in model mode (no project-directory file discovery there)"
          fi
          if [ -n "${PL_BUILD_TIMEOUT}" ]; then
            echo "::warning::build-timeout has no effect in model mode (no project-directory file discovery there)"
          fi
        fi
        if [ -n "${PL_ARGS//[[:space:]]/}" ]; then
          # Quote-aware split: PL_ARGS is a shell-like list of extra flags
          # (e.g. '--creator-name "CI Bot"'), not a single token. Plain bash
          # word-splitting (extra_args=(${PL_ARGS})) has no quote-awareness
          # and would break a quoted multi-word value into separate tokens,
          # so split it with Python's shlex instead. A read loop, not
          # readarray, which macOS's bash 3.2 lacks.
          require_python
          if ! extra_args_text=$(
            python_text -c 'import shlex, sys; print("".join(a + "\x1e" for a in shlex.split(sys.argv[1])))' \
              "${PL_ARGS}"
          ); then
            echo "::error::Cannot parse args; check its quoting"
            exit 1
          fi
          # Each argument ends with an ASCII record separator, so empty
          # arguments and embedded newlines survive the $(...) capture.
          while IFS= read -r -d $'\x1e' extra_arg; do
            loom_args+=("${extra_arg}")
          done <<< "${extra_args_text}"
        fi

        # Capture stdout and stderr in files (each still echoed to the log)
        # so a loom-picked default filename can be recovered below when
        # "output" was left empty, and so its INFO:/WARNING:/ERROR: lines --
        # the CLI output convention, always at the start of the line -- can
        # be re-emitted as ::notice::/::warning::/::error:: workflow
        # commands, giving them real GitHub Actions annotations (PR "Checks"
        # tab, job summary) instead of just plain log text.
        # Both tees are members of a pipeline, so both have finished when it
        # does (a process substitution would not be waited for, and Git Bash
        # has no /dev/stderr). Fd 3 carries loom's stdout past the stderr
        # tee; loom's exit status comes back through a file. -e is dropped
        # so a failing "loom" doesn't abort the script before its ERROR: line
        # gets annotated; the status is propagated explicitly afterward.
        # The raw echo is fenced with stop-commands (random token) so a
        # "::" line in loom's output is logged, not run as a workflow command.
        # The runner does not order stdout against stderr, so from here on
        # stdout goes to stderr: fence, raw echo and annotations stay in order.
        loom_stderr_file=$(mktemp)
        loom_stdout_file=$(mktemp)
        loom_exit_file=$(mktemp)
        trap 'rm -f "${loom_stderr_file}" "${loom_stdout_file}" "${loom_exit_file}"' EXIT
        stop_token="pitloom-$(basename "${loom_exit_file}")"
        exec 1>&2
        echo "::stop-commands::${stop_token}"
        set +e
        {
          {
            loom "${loom_args[@]}" 2>&1 1>&3 3>&-
            echo "$?" > "${loom_exit_file}"
          } | tee "${loom_stderr_file}" >&2
        } 3>&1 | tee "${loom_stdout_file}" >&2
        set -e
        echo "::${stop_token}::"
        loom_exit=$(<"${loom_exit_file}")
        loom_exit=${loom_exit:-1}
        # Windows Python ends every line with CR; drop it before parsing.
        loom_stdout=$(tr -d '\r' < "${loom_stdout_file}")

        last_annotation_level=""
        # "|| [ -n ]" keeps a final line that has no trailing newline.
        while IFS= read -r line || [ -n "${line}" ]; do
          line=${line%$'\r'}
          # The runner decodes %25/%0A/%0D in annotation text.
          line=${line//'%'/%25}
          case "${line}" in
            "ERROR: "*)
              last_annotation_level="error"
              echo "::error::${line#ERROR: }"
              ;;
            "WARNING: "*)
              last_annotation_level="warning"
              echo "::warning::${line#WARNING: }"
              ;;
            "INFO: "*)
              last_annotation_level="notice"
              echo "::notice::${line#INFO: }"
              ;;
            *)
              # A continuation line of a multi-line LEVEL: message --
              # the CLI output convention doesn't forbid one, even though
              # loom doesn't currently emit any. Re-annotate at the same
              # level rather than silently dropping it from the
              # PR-facing summary (it's still visible above via "tee"
              # either way).
              if [ -n "${last_annotation_level}" ] && [ -n "${line}" ]; then
                echo "::${last_annotation_level}::${line}"
              fi
              ;;
          esac
        done < "${loom_stderr_file}"

        if [ "${loom_exit}" -ne 0 ]; then
          exit "${loom_exit}"
        fi

        if [ "${skip_output}" = false ]; then
          if [ -n "${PL_OUTPUT}" ]; then
            sbom_path="${PL_OUTPUT}"
          elif [ "${is_embed}" = true ]; then
            # "loom embed-wheel" doesn't write a standalone copy unless -o is
            # given (only the wheel's embedded copy, named via
            # _derive_wheel_sbom_filename); extract that copy to disk so the
            # action can still surface a sbom-path and upload it.
            embed_wheel_path=$(
              python_text -c 'import glob, sys; print(glob.glob(sys.argv[1])[0])' \
                "${PL_EMBED_WHEEL}"
            )
            arcname=$(
              printf '%s\n' "${loom_stdout}" \
                | sed -n 's/^pitloom: embedded \(.*\) into .*$/\1/p' | head -n1
            )
            if [ -z "${arcname}" ]; then
              echo "::error::Cannot find the embedded SBOM name in loom's output"
              exit 1
            fi
            sbom_path=$(basename "${arcname}")
            "${python_bin}" -c 'import sys, zipfile; wp, an, op = sys.argv[1:4]; zf = zipfile.ZipFile(wp); data = zf.read(an); zf.close(); out = open(op, "wb"); out.write(data); out.close()' \
              "${embed_wheel_path}" "${arcname}" "${sbom_path}"
          else
            # "loom project"/"loom model" print their resolved default path
            # (see pitloom.cli.commands.utils._print_sbom_output_path).
            sbom_path=$(
              printf '%s\n' "${loom_stdout}" \
                | sed -n 's/^PITLOOM_SBOM_OUTPUT_PATH=//p' | head -n1
            )
          fi
          echo "sbom-path=${sbom_path}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Upload SBOM artifact
      if: inputs.upload-artifact == 'true' && steps.generate.outputs.sbom-path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.generate.outputs.sbom-path }}
