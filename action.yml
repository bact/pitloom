name: "Pitloom SBOM Generator"
description: >-
  Generate an SPDX 3 JSON-LD SBOM (or AI model AIBOM) for a Python project
  or AI model file using Pitloom.
author: "Arthit Suriyawongkul"

branding:
  icon: "package"
  color: "purple"

inputs:
  project-path:
    description: >-
      Directory to scan for a Python project (containing pyproject.toml,
      setup.cfg, or setup.py). Ignored when "model" is set.
    required: false
    default: "."
  model:
    description: >-
      Path to a local AI model file, or a Hugging Face URL / model ID.
      When set, runs model mode ("loom -m <model>") instead of project mode.
    required: false
    default: ""
  output:
    description: "SBOM output file path."
    required: false
    default: "sbom.spdx3.json"
  extras:
    description: >-
      Comma-separated pip extras to install alongside Pitloom, e.g.
      "aimodel,huggingface".
    required: false
    default: ""
  pretty:
    description: "Pretty-print the SBOM output with 2-space indentation."
    required: false
    default: "false"
  args:
    description: "Extra raw flags passed through to the loom command."
    required: false
    default: ""
  pitloom-version:
    description: >-
      Pitloom version or version specifier to install, e.g. "0.9.0" or
      ">=0.9,<0.10". Empty installs the latest release from PyPI.
    required: false
    default: ""
  python-version:
    description: "Python version passed to actions/setup-python."
    required: false
    default: "3.x"
  install:
    description: >-
      When "false", skip installing Python and Pitloom, and assume Pitloom
      is already available on PATH (used by Pitloom's own self-test to
      dogfood the local checkout via "uses: ./").
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the generated SBOM using actions/upload-artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Artifact name used when upload-artifact is true."
    required: false
    default: "sbom"

outputs:
  sbom-path:
    description: "Path to the generated SBOM file."
    value: ${{ steps.generate.outputs.sbom-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: inputs.install == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Pitloom
      if: inputs.install == 'true'
      shell: bash
      env:
        PL_EXTRAS: ${{ inputs.extras }}
        PL_VERSION: ${{ inputs.pitloom-version }}
      run: |
        set -euo pipefail

        spec="pitloom"
        if [ -n "${PL_EXTRAS}" ]; then
          spec="${spec}[${PL_EXTRAS}]"
        fi
        if [ -n "${PL_VERSION}" ]; then
          # pitloom-version accepts either a bare version ("0.9.0") or a
          # full specifier (">=0.9,<0.10"). A leading comparison operator
          # means it is already a specifier; only bare versions need "=="
          # inserted, otherwise "pitloom==>=0.9,<0.10" is invalid.
          case "${PL_VERSION}" in
            [\<\>=!~]*) spec="${spec}${PL_VERSION}" ;;
            *) spec="${spec}==${PL_VERSION}" ;;
          esac
        fi

        python -m pip install --upgrade pip
        pip install "${spec}"

    - name: Generate SBOM
      id: generate
      shell: bash
      env:
        PL_PROJECT_PATH: ${{ inputs.project-path }}
        PL_MODEL: ${{ inputs.model }}
        PL_OUTPUT: ${{ inputs.output }}
        PL_PRETTY: ${{ inputs.pretty }}
        PL_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        declare -a loom_args
        if [ -n "${PL_MODEL}" ]; then
          loom_args+=("-m" "${PL_MODEL}")
        else
          loom_args+=("${PL_PROJECT_PATH}")
        fi
        loom_args+=("-o" "${PL_OUTPUT}")
        if [ "${PL_PRETTY}" = "true" ]; then
          loom_args+=("--pretty")
        fi
        if [ -n "${PL_ARGS}" ]; then
          # Quote-aware split: PL_ARGS is a shell-like list of extra flags
          # (e.g. '--creator-name "CI Bot"'), not a single token. Plain bash
          # word-splitting (extra_args=(${PL_ARGS})) has no quote-awareness
          # and would break a quoted multi-word value into separate tokens,
          # so split it with Python's shlex instead.
          #
          # When install=false, "Set up Python" is skipped, so don't assume
          # python3 specifically is on PATH -- fall back to python.
          python_bin=python3
          command -v "${python_bin}" >/dev/null 2>&1 || python_bin=python
          readarray -t extra_args < <(
            "${python_bin}" -c 'import shlex, sys; print(*shlex.split(sys.argv[1]), sep="\n")' \
              "${PL_ARGS}"
          )
          loom_args+=("${extra_args[@]}")
        fi

        loom "${loom_args[@]}"

        echo "sbom-path=${PL_OUTPUT}" >> "${GITHUB_OUTPUT}"

    - name: Upload SBOM artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.generate.outputs.sbom-path }}
