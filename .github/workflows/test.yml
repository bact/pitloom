name: Unit tests

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        python-version: ["3.10", "3.14"]
      fail-fast: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[ai,content-type]" --group test

      - name: Cache LicenseID database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/licenseid
          key: ${{ runner.os }}-licenseid-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-licenseid-

      - name: Build licenseid database
        run: licenseid update

      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" == "3.14" ]; then
            pytest tests/ -v --tb=short \
              --cov=pitloom \
              --cov-report=xml \
              --cov-report=term-missing
          else
            pytest tests/ -v --tb=short
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
