name: Unit tests

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths
    # labeled: the `test-all-os` label runs every test on Windows and macOS.
    types: [opened, synchronize, reopened, labeled]

permissions: read-all

concurrency:
  # An unrelated label starts a run of its own (its jobs are skipped), so it
  # cannot cancel the run that is testing the branch.
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'test-all-os' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Push to main only. Skips the Linux legs when the merge commit has the tree of
  # a PR head that already passed this workflow (see
  # scripts/ci/skip_duplicate_push.py). Fail open: any doubt runs the tests.
  # A push run is never a required check for a merge, so the skipped matrix
  # names (reported unexpanded) cannot block a PR.
  decide:
    name: Decide whether to run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - id: dup
        uses: ./.github/actions/skip-duplicate-push
        with:
          workflow-file: test.yml
          token: ${{ github.token }}

  # Pull requests only: whether the PR has the `test-all-os` label when the
  # job runs (the event payload may predate the label; see the action).
  labels:
    name: Read the test-all-os label
    if: >-
      ${{ github.event_name == 'pull_request'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'test-all-os') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all-os: ${{ steps.read.outputs.all-os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/actions

      - id: read
        uses: ./.github/actions/test-all-os
        with:
          token: ${{ github.token }}

  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: [decide, labels]
    # decide is skipped on PRs, labels on pushes, and either may fail:
    # !cancelled() lets the matrix run; a "true" skip only shrinks the matrix
    # (below).
    # A `labeled` event runs the matrix only for the `test-all-os` label.
    if: >-
      ${{ !cancelled()
      && (github.event.action != 'labeled'
      || github.event.label.name == 'test-all-os') }}
    runs-on: ${{ matrix.os }}
    # A leg takes 5 to 10 minutes. Without a limit, a hung test worker waits
    # for GitHub's 6-hour default; this turns a hang into a readable failure.
    timeout-minutes: 30
    strategy:
      # 3.15: not run, since the `ai` extra's wheels (such as onnx) are
      # not available for 3.15 yet; the core code is expected to work.
      # After a skipped duplicate push only Windows and macOS run: the PR run
      # tested them on the `platform` files alone, so main runs them in full.
      matrix: >-
        ${{ fromJSON(needs.decide.outputs.skip == 'true'
        && '{"include":[
        {"os":"windows-latest","python-version":"3.11"},
        {"os":"macos-latest","python-version":"3.13"}]}'
        || '{"include":[
        {"os":"ubuntu-latest","python-version":"3.10"},
        {"os":"windows-latest","python-version":"3.11"},
        {"os":"macos-latest","python-version":"3.13"},
        {"os":"ubuntu-latest","python-version":"3.14","coverage":true}]}') }}
      fail-fast: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        uses: ./.github/actions/install-pitloom
        with:
          groups: --group test
          package-spec: ".[ai,content-type]"

      - name: Build licenseid database
        # Offline, from the SPDX License List the licenseid wheel ships.
        run: licenseid update --source packaged

      - name: Run tests
        # Windows, macOS: a pull request runs only the OS-dependent files
        # (`-m platform`, rule in tests/_platform.py); a push to main, or a
        # pull request with the `test-all-os` label, runs every test. Linux
        # always runs every test (and the coverage leg is on Linux).
        # Windows: TMP/TEMP (and so pytest's basetemp and every subprocess's
        # temp files) on RUNNER_TEMP, the checkout's D: drive, instead of
        # C:\Users\RUNNER~1\...\Temp; file-heavy tests ran faster there.
        # --junitxml: every test's time, for comparing legs (artifact below).
        # -m "not network": tests that reach a real host run in live-tests.yml and
        # in the release gate (pypi-publish.yml), not here; a slow host is not a
        # failure of the change under test. Local-server tests (loopback) run.
        env:
          # Fail open: a failed labels job (empty output) tests every OS.
          ALL_OS: ${{ github.event_name != 'pull_request' || needs.labels.outputs.all-os != 'false' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP"
          fi
          expr="not network"
          if [ "$RUNNER_OS" != "Linux" ] && [ "$ALL_OS" != "true" ]; then
            expr="platform and not network"
          fi
          if [ "${{ matrix.coverage }}" == "true" ]; then
            pytest tests/ -m "$expr" -v --tb=short --durations=20 \
              --junitxml=pytest-junit.xml \
              --cov=pitloom \
              --cov-report=xml \
              --cov-report=term-missing
          else
            pytest tests/ -m "$expr" -v --tb=short --durations=20 \
              --junitxml=pytest-junit.xml
          fi

      - name: Upload per-test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-junit.xml
          retention-days: 14

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
