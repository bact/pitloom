name: Publish to PyPI

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sbom-path: ${{ steps.pitloom.outputs.sbom-path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"

      - name: Install Pitloom from checkout
        uses: ./.github/actions/install-pitloom
        with:
          extra-packages: editables build==1.6.1 spdx3-validate==0.0.7
          package-spec: ".[content-type]"
          editable: "true"

      - name: Build sdist and wheel
        run: |
          # --no-isolation: use the checkout's local Pitloom, not an
          # isolated build env, so the build hook embeds a freshly
          # generated SBOM (.dist-info/sboms/) using this checkout
          # instead of fetching pitloom from PyPI.
          python -m build --no-isolation

      - name: Resolve the built wheel
        # Computed here, before the embed step below, so an ambiguous
        # dist/*.whl is caught at its source instead of after
        # embed-wheel's own glob has already silently absorbed it (its
        # multi-match handling skips embedding rather than failing --
        # see attach-release-sbom's "if:" comment below). Every
        # downstream step (verify, embed, validate) trusts this single
        # resolved path instead of re-deriving and re-validating it.
        id: wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found" \
              "${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify build hook embedded an SBOM
        # hatch-integration.yml/build.yml already test the hook, but only
        # against a fixture/editable install, not the real release
        # package -- confirms it works here too before "Regenerate and
        # embed SBOM" below overwrites its output.
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          loom verify-wheel --fail-on-mismatch "${WHEEL_PATH}"

      - name: Regenerate and embed SBOM
        # uses: ./ + install: false runs this commit's own Action/CLI
        # (reusing the checkout installed above) against the release wheel,
        # and also writes a standalone copy for the steps below.
        id: pitloom
        uses: ./
        with:
          embed-wheel: ${{ steps.wheel.outputs.path }}
          install: "false"
          content-type: "true"
          upload-artifact: "true"
          artifact-name: "sbom"

      - name: Check SBOM is at the PEP 770 location
        env:
          SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          loom verify-wheel --fail-on-mismatch "${WHEEL_PATH}" \
            --sbom-filename "$(basename "${SBOM_PATH}")"

      - name: Validate SBOM
        env:
          SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          loom validate-wheel "${WHEEL_PATH}" \
            --sbom-filename "$(basename "${SBOM_PATH}")"

      - name: Validate standalone SBOM with spdx3-validate
        # Hard gate: Pitloom must not publish while its own SBOM fails
        # schema/SHACL validation, and a failure to download the schema
        # (network) fails this step too -- it is never skipped. Version
        # auto-detected; --spdx-version is omitted (spdx3-validate 0.0.7
        # raises AttributeError on args.version), as in build.yml.
        env:
          SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
        run: |
          set -euo pipefail
          if [ -z "${SBOM_PATH}" ]; then
            echo "::error::no standalone SBOM was produced to validate"
            exit 1
          fi
          spdx3-validate --json "${SBOM_PATH}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  network-quality-gate:
    name: Network-dependent tests (strict)
    runs-on: ubuntu-latest
    # spdx3-validate's urlopen sets no timeout; bound a hung download.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"

      - name: Install dependencies
        uses: ./.github/actions/install-pitloom
        with:
          groups: --group test
          extra-packages: spdx3-validate==0.0.7
          package-spec: ".[ai,content-type]"

      - name: Run network-dependent tests, failing on any network error
        # PITLOOM_REQUIRE_NETWORK=1 turns tests/_network.py's skip-on-network-
        # failure into a failure, and any skipped network test into one too
        # (tests/conftest.py), so an unreachable spdx.org or PyPI blocks
        # publishing. Pytest exits 5 when no network test is collected.
        env:
          PITLOOM_REQUIRE_NETWORK: "1"
        run: |
          set -euo pipefail
          pytest tests/ -m network -v --tb=short -rs

  publish:
    name: Publish to PyPI
    needs: [build, network-quality-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  attach-release-sbom:
    name: Attach SBOM to GitHub Release
    needs: [build, publish]
    # A custom "if:" replaces needs:'s implicit success() gate, so all
    # conditions are explicit here:
    # - build.result == 'success': skip if "Validate SBOM" failed in "build".
    # - publish.result == 'success': skip if PyPI publish failed, so the
    #   release never carries an SBOM for a package that wasn't published.
    # - sbom-path != '': skip if "build" produced no standalone SBOM (the
    #   embed-wheel Action step failed to write one), since no "sbom"
    #   artifact was uploaded for this job to download.
    if: |
      needs.build.result == 'success' && needs.publish.result == 'success' &&
      needs.build.outputs.sbom-path != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload, for the standalone SBOM asset

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SBOM_BASENAME: ${{ needs.build.outputs.sbom-path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "sbom/${SBOM_BASENAME}" \
            --clobber --repo "${REPO}"

  attach-release-dist:
    name: Attach distribution to GitHub Release
    needs: [build, publish]
    # Only attach once PyPI publish has actually succeeded, so the release
    # page never carries artifacts that weren't published (or were
    # published as something different, if a later step were to fail).
    if: needs.build.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload, for the sdist/wheel assets

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attach sdist and wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${REPO}"

  sign-and-attest:
    name: Sign artifacts and attach provenance
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release upload, for signature/attestation assets
      id-token: write       # Sigstore keyless signing + attestation signing
      attestations: write   # actions/attest-build-provenance

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          # Default is "true" and, on a release-triggered run, additionally
          # downloads and signs GitHub's auto-generated source zip/tar.gz
          # archives -- unwanted here, and a hard failure (unhandled
          # requests.raise_for_status()) if that download ever 404s/429s.
          release-signing-artifacts: "false"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: Attach signatures and provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.sigstore.json \
            --clobber --repo "${REPO}"
