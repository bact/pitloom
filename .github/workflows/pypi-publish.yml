name: Publish to PyPI

on:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom-path: ${{ steps.pitloom.outputs.sbom-path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 spdx3-validate==0.0.7

      - name: Install Pitloom from checkout
        run: pip install -e ".[content-type]"

      - name: Build sdist and wheel
        run: |
          # --no-isolation: use the checkout's local Pitloom, not an isolated
          # build env, so the build hook embeds a freshly generated SBOM
          # (.dist-info/sboms/). The Action step below regenerates and
          # overwrites this copy in the published wheel.
          python -m build --no-isolation

      - name: Regenerate and embed SBOM
        # uses: ./ + install: false runs this commit's own Action/CLI
        # (reusing the checkout installed above) against the release wheel,
        # and also writes a standalone copy for the steps below.
        id: pitloom
        uses: ./
        with:
          embed-wheel: "dist/*.whl"
          install: "false"
          content-type: "true"
          upload-artifact: "true"
          artifact-name: "sbom"

      - name: Check SBOM is at the PEP 770 location
        env:
          SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found" \
              "${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          whl="${wheels[0]}"
          sbom_basename=$(basename "${SBOM_PATH}")

          # Match the exact embedded basename, not just "any .spdx3.json
          # exists". Bash glob, not grep -E, so dots/dashes in the
          # basename stay literal.
          matched=""
          while IFS= read -r entry; do
            case "${entry}" in
              *.dist-info/sboms/"${sbom_basename}")
                matched="${entry}"
                break
                ;;
            esac
          done < <(unzip -Z1 "${whl}")

          if [ -z "${matched}" ]; then
            echo "::error::${sbom_basename} not found under" \
              "*.dist-info/sboms/ in ${whl}"
            exit 1
          fi
          echo "Found: ${matched}"

      - name: Validate SBOM
        run: |
          spdx3-validate --json "${{ steps.pitloom.outputs.sbom-path }}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  attach-release-sbom:
    name: Attach SBOM to GitHub Release
    needs: [build, publish]
    # A custom "if:" replaces needs:'s implicit success() gate, so all
    # conditions are explicit here:
    # - build.result == 'success': skip if "Validate SBOM" failed in "build".
    # - publish.result == 'success': skip if PyPI publish failed, so the
    #   release never carries an SBOM for a package that wasn't published.
    # - sbom-path != '': skip if "build" produced no standalone SBOM
    #   (embed-wheel matched more than one wheel), since no "sbom"
    #   artifact was uploaded for this job to download.
    if: |
      needs.build.result == 'success' && needs.publish.result == 'success' &&
      needs.build.outputs.sbom-path != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload, for the standalone SBOM asset

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SBOM_BASENAME: ${{ needs.build.outputs.sbom-path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "sbom/${SBOM_BASENAME}" \
            --clobber --repo "${REPO}"

  attach-release-dist:
    name: Attach distribution to GitHub Release
    needs: [build, publish]
    # Only attach once PyPI publish has actually succeeded, so the release
    # page never carries artifacts that weren't published (or were
    # published as something different, if a later step were to fail).
    if: needs.build.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload, for the sdist/wheel assets

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attach sdist and wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${REPO}"

  sign-and-attest:
    name: Sign artifacts and attach provenance
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release upload, for signature/attestation assets
      id-token: write       # Sigstore keyless signing + attestation signing
      attestations: write   # actions/attest-build-provenance

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          # Default is "true" and, on a release-triggered run, additionally
          # downloads and signs GitHub's auto-generated source zip/tar.gz
          # archives -- unwanted here, and a hard failure (unhandled
          # requests.raise_for_status()) if that download ever 404s/429s.
          release-signing-artifacts: "false"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: Attach signatures and provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.sigstore.json \
            --clobber --repo "${REPO}"
