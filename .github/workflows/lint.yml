name: Lint and format

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.10"

      - name: Install dependencies
        uses: ./.github/actions/install-pitloom
        with:
          groups: --group lint --group test
          package-spec: ".[ai,content-type]"

      - name: Ruff check
        run: |
          ruff check examples/ src/ tests/

      - name: Pylint
        # tests/*/: pylint does not descend from the tests/ package into
        # subfolders without __init__.py.
        run: |
          pylint examples/ src/ tests/ tests/*/

      - name: Flake8
        run: |
          flake8 examples/ src/ tests/

      - name: Ruff formatter check
        run: |
          ruff format --check examples/ src/ tests/
