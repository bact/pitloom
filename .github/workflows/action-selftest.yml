# Dogfood test: exercise Pitloom's own composite action ("uses: ./") against
# the Pitloom repository itself, so the Action is validated the same way any
# downstream consumer would use it.
#
# See also: action-selftest-install.yml, which covers the action's own
# install path (Pitloom version and Python selection).

name: Action self-test

on:
  push:
    branches: [main, develop]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-selftest:
    name: Self-test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pitloom from checkout
        # Self-test runs project mode, embed-wheel mode, and --allow-build
        # (needs the "build" extra: PyPA build powers the build-and-read
        # mechanism -- see pitloom.core._models_wheel_build_and_read).
        uses: ./.github/actions/install-pitloom
        with:
          extra-packages: >-
            editables build==1.6.1 check-wheel-contents==0.6.3
            installer==1.0.1
          package-spec: ".[validate,build]"
          editable: "true"

      - name: Build licenseid database
        run: licenseid update
        continue-on-error: true

      - name: Run Pitloom action against this repository
        id: pitloom
        uses: ./
        with:
          project-path: "."
          output: "selftest-sbom.spdx3.json"
          pretty: "true"
          install: "false"
          upload-artifact: "true"
          artifact-name: "action-selftest-sbom-py${{ matrix.python-version }}"

      - name: Assert SBOM output exists and is valid JSON-LD
        run: |
          set -euo pipefail

          SBOM_PATH="${{ steps.pitloom.outputs.sbom-path }}"
          echo "SBOM path: ${SBOM_PATH}"

          if [ ! -s "${SBOM_PATH}" ]; then
            echo "::error title=Missing SBOM::${SBOM_PATH} was not created."
            exit 1
          fi

          python - "${SBOM_PATH}" <<'EOF'
          import json
          import sys

          sbom_path = sys.argv[1]
          with open(sbom_path, encoding="utf-8") as f:
              sbom = json.load(f)

          if "@graph" not in sbom:
              print("ERROR: SBOM is missing the '@graph' key.", file=sys.stderr)
              sys.exit(1)

          graph = sbom["@graph"]
          names = [e.get("name") for e in graph if e.get("type") == "software_Package"]
          purls = [
              e.get("software_packageUrl")
              for e in graph
              if e.get("type") == "software_Package"
          ]

          if "pitloom" not in names:
              print(
                  f"ERROR: 'pitloom' package not found in SBOM. Packages: {names}",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not any(
              (purl or "").startswith("pkg:pypi/pitloom@") for purl in purls
          ):
              print(
                  f"ERROR: No 'pkg:pypi/pitloom@...' PURL found. PURLs: {purls}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"SBOM OK: {len(graph)} graph elements, packages={names[:5]}...")
          EOF

      - name: Validate SBOM with pitloom fragment validate (best-effort)
        run: |
          pitloom fragment validate "${{ steps.pitloom.outputs.sbom-path }}"
        continue-on-error: true

      - name: Run Pitloom action with default output (project mode)
        # No "output:" given -- exercises the action's own default-naming
        # resolution (PITLOOM_SBOM_OUTPUT_PATH= stdout parsing), not the generic
        # "sbom.spdx3.json" the action used to force.
        id: pitloom-default
        uses: ./
        with:
          project-path: "."
          install: "false"
          upload-artifact: "false"

      - name: Assert default output filename is packagename-version, not generic
        run: |
          set -euo pipefail

          SBOM_PATH="${{ steps.pitloom-default.outputs.sbom-path }}"
          echo "Default SBOM path: ${SBOM_PATH}"

          if [ ! -s "${SBOM_PATH}" ]; then
            echo "::error title=Missing SBOM::${SBOM_PATH} was not created."
            exit 1
          fi
          case "${SBOM_PATH}" in
            pitloom-*.spdx3.json) ;;
            *)
              echo "::error title=Unexpected default filename::" \
                "expected pitloom-<version>.spdx3.json, got ${SBOM_PATH}"
              exit 1
              ;;
          esac

      - name: Build a wheel
        run: |
          python -m build --wheel --no-isolation --outdir dist/

      - name: Run Pitloom action with embed-wheel
        id: pitloom-embed
        uses: ./
        with:
          embed-wheel: "dist/*.whl"
          project-path: "."
          output: "embedded-selftest-sbom.spdx3.json"
          pretty: "true"
          install: "false"
          upload-artifact: "false"

      - name: Run Pitloom action with embed-wheel and default output
        # No "output:" given -- exercises the action's arcname-parsing +
        # wheel-zip-extraction fallback, not the generic "sbom.spdx3.json"
        # the action used to force.
        id: pitloom-embed-default
        uses: ./
        with:
          embed-wheel: "dist/*.whl"
          project-path: "."
          install: "false"
          upload-artifact: "false"

      - name: Assert embed-wheel default output filename is packagename-version
        run: |
          set -euo pipefail

          SBOM_PATH="${{ steps.pitloom-embed-default.outputs.sbom-path }}"
          echo "Default embed-wheel SBOM path: ${SBOM_PATH}"

          if [ ! -s "${SBOM_PATH}" ]; then
            echo "::error title=Missing SBOM::${SBOM_PATH} was not created."
            exit 1
          fi
          case "${SBOM_PATH}" in
            pitloom-*.spdx3.json) ;;
            *)
              echo "::error title=Unexpected default filename::" \
                "expected pitloom-<version>.spdx3.json, got ${SBOM_PATH}"
              exit 1
              ;;
          esac

      - name: Validate embedded wheel and SBOM with authoritative tools
        run: |
          set -euo pipefail

          # 1. pitloom fragment validate (spdx3-validate's library API)
          pitloom fragment validate "${{ steps.pitloom-embed.outputs.sbom-path }}"

          # 2. PyPA installer (RECORD verification)
          python -c '
          import glob
          from installer.sources import WheelFile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) > 0, "No wheels found in dist/"
          for w in wheels:
              with WheelFile.open(w) as wf:
                  wf.validate_record()
              print(f"PyPA installer validation passed for {w}")
          '

          # 3. check-wheel-contents
          check-wheel-contents dist/*.whl

          # 4. pip install --dry-run
          pip install --dry-run --target /tmp/pip-test --no-deps dist/*.whl

      - name: Extract a real uv_build sdist fixture for --allow-build
        # rendercv (uv_build-backed, no static discovery module of its own
        # -- see pitloom.core._models_wheel_dispatch) exercises the generic,
        # backend-agnostic build-and-read mechanism end to end through the
        # Action, not just via unit tests. A real vendored sdist, not a
        # synthetic fixture: --allow-build runs a real PEP 517 build, so
        # the point is proving it against an actual third-party project.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/uv-build-fixture"
          tar -xzf \
            tests/fixtures/real-world-projects/uv_build/rendercv-2.8/rendercv-2.8.tar.gz \
            -C "${RUNNER_TEMP}/uv-build-fixture"
          echo "UV_BUILD_PROJECT_PATH=${RUNNER_TEMP}/uv-build-fixture/rendercv-2.8" \
            >> "${GITHUB_ENV}"

      - name: Run Pitloom action with --allow-build against a uv_build project
        id: pitloom-allow-build
        uses: ./
        with:
          project-path: "${{ env.UV_BUILD_PROJECT_PATH }}"
          output: "uv-build-allow-build-sbom.spdx3.json"
          pretty: "true"
          allow-build: "true"
          build-timeout: "900"
          install: "false"
          upload-artifact: "false"

      - name: Assert --allow-build discovered the project's real file list
        # Without --allow-build, uv_build has no static discovery module
        # (see backend_discoverers in _models_wheel_dispatch.py) and falls
        # back to the Hatchling-based heuristic with a WARNING: -- for a
        # foreign, non-Hatchling layout like rendercv's, that heuristic
        # resolves far fewer files than the real wheel. Asserting a
        # comfortably-real file count (the actual published wheel has 143
        # files, per tests/fixtures/real-world-projects/uv_build/
        # rendercv-2.8/expected.json) proves the real PEP 517 build ran,
        # not just that some fallback file list happened to be non-empty.
        run: |
          set -euo pipefail

          SBOM_PATH="${{ steps.pitloom-allow-build.outputs.sbom-path }}"
          echo "uv_build --allow-build SBOM path: ${SBOM_PATH}"

          if [ ! -s "${SBOM_PATH}" ]; then
            echo "::error title=Missing SBOM::${SBOM_PATH} was not created."
            exit 1
          fi

          python - "${SBOM_PATH}" <<'EOF'
          import json
          import sys

          sbom_path = sys.argv[1]
          with open(sbom_path, encoding="utf-8") as f:
              sbom = json.load(f)

          graph = sbom.get("@graph", [])
          file_count = sum(1 for e in graph if e.get("type") == "software_File")
          names = [e.get("name") for e in graph if e.get("type") == "software_Package"]

          if "rendercv" not in names:
              print(
                  f"ERROR: 'rendercv' package not found in SBOM. Packages: {names}",
                  file=sys.stderr,
              )
              sys.exit(1)

          MIN_EXPECTED_FILES = 100  # real wheel has 143; a heuristic-only
          # fallback (no real build) would resolve nowhere close to this.
          if file_count < MIN_EXPECTED_FILES:
              print(
                  f"ERROR: only {file_count} software_File entries found -- "
                  f"expected >= {MIN_EXPECTED_FILES}, suggesting --allow-build's "
                  "real PEP 517 build did not actually run.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"--allow-build OK: {file_count} files discovered for rendercv.")
          EOF
