name: Validate Claude Code plugin

on:
  push:
    branches: [main, develop, "maint-*"]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - ".github/workflows/plugin-validate.yml"
  pull_request:
    branches: [main, develop, "maint-*"]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - ".github/workflows/plugin-validate.yml"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.238

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json
