name: Validate Claude Code plugin

on:
  push:
    branches: [main, develop]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - ".github/workflows/plugin-validate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - ".github/workflows/plugin-validate.yml"

permissions: read-all

jobs:
  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json
