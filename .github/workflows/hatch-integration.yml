# Integration test: build the sampleproject fixture with
# Pitloom's Hatchling hook and verify that the wheel
# contains a valid SPDX 3 SBOM (PEP 770).

name: Hatch integration

on:
  push:
    branches: [main, develop, "maint-*"]
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "CITATION.cff"
      - "codemeta.json"
      - ".gitignore"
  pull_request:
    branches: [main, develop, "maint-*"]
    paths-ignore: *ignore-paths

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hatch-integration:
    name: Hook on Python ${{ matrix.python-version }} / Hatchling ${{ matrix.hatchling-version || 'latest' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        python-version: ["3.10", "3.14"]
        # hatchling-version: the pyproject.toml floor ("hatchling>=1.29.0",
        # no upper bound) and "" for latest -- catches an undocumented
        # break in a new Hatchling release before it ships (see
        # working-docs/implementation/hatchling-build-hook.md).
        hatchling-version: ["1.29.0", ""]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pitloom and build tools
        # HATCH_BUILD_NO_HOOKS only scopes to this step -- "Build
        # sampleproject" below still runs the hook under test.
        uses: ./.github/actions/install-pitloom
        with:
          hatchling-version: ${{ matrix.hatchling-version }}
          extra-packages: editables build==1.6.1 spdx3-validate==0.0.7
          package-spec: "."
          editable: "true"

      - name: Print installed Hatchling version
        run: |
          python -c "import hatchling; from importlib.metadata import version; print('Hatchling', version('hatchling'))"

      - name: Build sampleproject with --no-isolation
        # --no-isolation picks up the locally installed Pitloom instead of
        # fetching it from PyPI, so the hook under test is the current code.
        run: |
          cd tests/fixtures/projects/sampleproject-hatchling
          python -m build --wheel --no-isolation
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error title=No Wheel Found::No .whl file found in dist/ after build" >&2
            exit 1
          fi
          WHEEL="${wheels[0]}"
          echo "WHEEL_PATH=${WHEEL}" >> "$GITHUB_ENV"
          echo "WHEEL_NAME=$(basename "${WHEEL}")" >> "$GITHUB_ENV"

      - name: Verify SBOM embedded in wheel
        # Authoritative presence/location/ambiguity check (e.g. a stale
        # second SBOM in dist/) -- the step below trusts this ran and
        # just re-locates the file. --fail-on-mismatch: a name/version
        # mismatch against the wheel's own METADATA is a real bug here.
        run: |
          cd tests/fixtures/projects/sampleproject-hatchling
          loom verify-wheel --fail-on-mismatch "${WHEEL_PATH}"

      - name: Verify SBOM content
        # [tool.pitloom] sbom-basename = "sbom" in this fixture's
        # pyproject.toml pins the filename read here.
        run: |
          cd tests/fixtures/projects/sampleproject-hatchling
          python - <<'EOF'
          import json
          import sys
          import zipfile
          from pathlib import Path

          wheel_path = next(Path("dist").glob("*.whl"))
          sbom_key = next(
              name
              for name in zipfile.ZipFile(wheel_path).namelist()
              if name.endswith(".dist-info/sboms/sbom.spdx3.json")
          )
          print(f"Found SBOM at: {sbom_key}")

          with zipfile.ZipFile(wheel_path) as zf:
              sbom = json.loads(zf.read(sbom_key).decode("utf-8"))

          if "@graph" not in sbom:
              print("ERROR: SBOM JSON-LD is missing '@graph' key.", file=sys.stderr)
              sys.exit(1)

          graph = sbom["@graph"]
          pkg_names = [
              e.get("name")
              for e in graph
              if e.get("type") == "software_Package"
          ]
          # metadata_from_hatchling() uses core.raw_name (the un-normalized
          # name), not Hatchling's PEP-503-normalized core.name, so the
          # package name in the SBOM is "sampleproject_hatchling" -- exactly
          # the spelling written in pyproject.toml's [project] name --
          # matching what the CLI (read_pyproject) would report.
          if "sampleproject_hatchling" not in pkg_names:
              print(
                  f"ERROR: 'sampleproject_hatchling' not found in SBOM packages: {pkg_names}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"SBOM packages: {pkg_names}")

          # Resolve spdxId/@id references to the actual graph elements, the
          # same way a real SPDX 3 consumer would.
          elements_by_id = {}
          for element in graph:
              element_id = element.get("spdxId", element.get("@id"))
              if element_id is not None:
                  elements_by_id[element_id] = element

          creation_infos = [e for e in graph if e.get("type") == "CreationInfo"]
          if len(creation_infos) != 1:
              print(
                  f"ERROR: Expected exactly 1 CreationInfo element, found "
                  f"{len(creation_infos)}",
                  file=sys.stderr,
              )
              sys.exit(1)
          creation_info = creation_infos[0]

          created_by_ids = creation_info.get("createdBy", [])
          created_by = [elements_by_id[i] for i in created_by_ids]
          if len(created_by) != 2:
              print(
                  f"ERROR: Expected 2 createdBy agents, found {len(created_by)}: "
                  f"{created_by}",
                  file=sys.stderr,
              )
              sys.exit(1)

          persons = [a for a in created_by if a.get("type") == "Person"]
          orgs = [a for a in created_by if a.get("type") == "Organization"]
          if len(persons) != 1 or persons[0].get("name") != "Pitloom CI":
              print(
                  f"ERROR: Expected 1 Person named 'Pitloom CI' in createdBy, "
                  f"found: {persons}",
                  file=sys.stderr,
              )
              sys.exit(1)
          if len(orgs) != 1 or orgs[0].get("name") != "Sample Project Org":
              print(
                  f"ERROR: Expected 1 Organization named 'Sample Project Org' in "
                  f"createdBy, found: {orgs}",
                  file=sys.stderr,
              )
              sys.exit(1)

          created_using_ids = creation_info.get("createdUsing", [])
          created_using = [elements_by_id[i] for i in created_using_ids]
          tool_names = sorted(t.get("name") for t in created_using)
          if len(created_using) != 2 or tool_names != ["CI Wrapper", "Pitloom"]:
              print(
                  f"ERROR: Expected createdUsing tools ['CI Wrapper', 'Pitloom'], "
                  f"found: {tool_names}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"createdBy: {[a.get('name') for a in created_by]}")
          print(f"createdUsing: {tool_names}")
          print("SBOM presence check passed.")
          EOF

      - name: Extract standalone SBOM copy for artifact upload
        # Extracted before validation runs, so the if: always() upload
        # step below can still attach it even when validation fails --
        # useful for debugging exactly that failure.
        run: |
          cd tests/fixtures/projects/sampleproject-hatchling
          python - <<'EOF'
          import zipfile
          from pathlib import Path

          wheel_path = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel_path) as zf:
              for name in zf.namelist():
                  if name.endswith(".dist-info/sboms/sbom.spdx3.json"):
                      data = zf.read(name)
                      Path("dist/sbom.spdx3.json").write_bytes(data)
                      print(f"Extracted {name} -> dist/sbom.spdx3.json")
                      break
          EOF

      - name: Validate SBOM with loom validate-wheel
        # Validates directly from the wheel (no manual re-extraction
        # needed) -- loom validate-wheel handles the extract-to-tempfile
        # + spdx3-validate call internally.
        run: |
          cd tests/fixtures/projects/sampleproject-hatchling
          loom validate-wheel "${WHEEL_PATH}"

      - name: Create job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Hatch integration -- Python ${{ matrix.python-version }} / Hatchling ${{ matrix.hatchling-version || 'latest' }}

          | Step | Result |
          | :--- | :--- |
          | Build wheel with Pitloom hook | ${{ job.status }} |
          | SBOM present in wheel (PEP 770) | See logs |
          | SPDX 3 validation | See logs |
          EOF

      - name: Upload wheel and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hatch-integration-py${{ matrix.python-version }}-hatchling${{ matrix.hatchling-version || 'latest' }}
          path: |
            tests/fixtures/projects/sampleproject-hatchling/dist/*.whl
            tests/fixtures/projects/sampleproject-hatchling/dist/sbom.spdx3.json
          retention-days: 3
