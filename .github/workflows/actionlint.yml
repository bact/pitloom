name: Validate GitHub Actions

on:
  push:
    branches: [main, develop]
    paths:
      - "action.yml"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "action.yml"
      - ".github/workflows/**"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          pwd >> "${GITHUB_PATH}"

      - name: Lint workflow files
        run: actionlint

      - name: Check action.yml is valid YAML
        # actionlint only understands workflow schema (on:/jobs:), not the
        # composite-action manifest schema (name:/inputs:/runs:), so it
        # cannot lint action.yml itself -- this is a syntax check only.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
