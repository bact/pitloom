name: Build wheels + validate SBOM

on:
  push:
    branches: [main, develop]
    # CITATION.cff and codemeta.json are not ignored: they are the
    # concluded-licence sources "Check SBOM licence" below guards.
    paths-ignore: &ignore-paths
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    paths-ignore: *ignore-paths
  workflow_dispatch:
    inputs:
      spdx_version:
        description: "SPDX version to validate against"
        required: false
        default: "3.0.1"
        type: choice
        options:
          - "3.0.0"
          - "3.0.1"
          - "3.1"
          - "auto"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SPDX 3.0.1 URLs (default)
  SPDX_VERSION: ${{ github.event.inputs.spdx_version || '3.0.1' }}
  SPDX_JSON_SCHEMA_URL_3_0_1: "https://spdx.org/schema/3.0.1/spdx-json-schema.json"
  SPDX_OWL_ONTOLOGY_URL_3_0_1: "https://spdx.org/rdf/3.0.1/spdx-model.ttl"
  SPDX_JSONLD_CONTEXT_URL_3_0_1: "https://spdx.org/rdf/3.0.1/spdx-context.jsonld"
  SPDX_ANNOTATION_URL_3_0_1: "https://spdx.org/rdf/3.0.1/spdx-json-serialize-annotations.ttl"

  # SPDX 3.1 URLs (for future use)
  SPDX_JSON_SCHEMA_URL_3_1: "https://spdx.github.io/spdx-spec/v3.1/rdf/schema.json"
  SPDX_OWL_ONTOLOGY_URL_3_1: "https://spdx.github.io/spdx-spec/v3.1/rdf/spdx-model.ttl"
  SPDX_JSONLD_CONTEXT_URL_3_1: "https://spdx.github.io/spdx-spec/v3.1/rdf/spdx-context.jsonld"
  SPDX_ANNOTATION_URL_3_1: "https://spdx.github.io/spdx-spec/v3.1/rdf/spdx-json-serialize-annotations.ttl"

jobs:
  build-wheel:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
      fail-fast: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pitloom from checkout
        # HATCH_BUILD_NO_HOOKS only scopes to this step -- "Build wheel"
        # below still runs the hook.
        uses: ./.github/actions/install-pitloom
        with:
          extra-packages: editables build==1.6.1 spdx3-validate==0.0.7
          package-spec: "."
          editable: "true"

      - name: Build wheel
        id: build
        run: |
          # --no-isolation: use the locally installed Pitloom so the build hook
          # embeds a freshly generated SBOM into the wheel (.dist-info/sboms/).
          python -m build --wheel --no-isolation
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error title=No Wheel Found::No .whl file found in dist/ after build" >&2
            exit 1
          fi
          WHEEL_NAME=$(basename "${wheels[0]}")
          echo "wheel_name=${WHEEL_NAME}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build Success::Successfully built wheel: ${WHEEL_NAME}"
        continue-on-error: true

      - name: Display build error
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Build Failed::Wheel build failed for Python ${{ matrix.python-version }}. Check the build logs for details."
          exit 1

      - name: Verify SBOM embedded in wheel
        id: verify_wheel_sbom
        if: steps.build.outcome == 'success'
        run: |
          loom verify-wheel --fail-on-mismatch "dist/${{ steps.build.outputs.wheel_name }}"
        continue-on-error: true

      - name: Display wheel SBOM verification error
        if: steps.build.outcome == 'success' && steps.verify_wheel_sbom.outcome == 'failure'
        run: |
          echo "::error title=Embedded SBOM Verification Failed::loom verify-wheel rejected the wheel's embedded SBOM (missing, ambiguous, misplaced, or a name/version mismatch against the wheel's own METADATA). See the 'Verify SBOM embedded in wheel' step's log for the exact reason."

      - name: Validate embedded wheel SBOM
        # Schema/SHACL check on the SBOM the build hook actually embedded
        # -- distinct from "Validate SBOM with spdx3-validate" below,
        # which checks a separately generated standalone SBOM from a
        # different code path (see CLAUDE.md's "Usage surfaces").
        # Fetches the SPDX schema/context too: retried and classified as
        # in "Validate SBOM with spdx3-validate" below.
        id: validate_wheel_sbom
        if: steps.verify_wheel_sbom.outcome == 'success'
        timeout-minutes: 20
        env:
          WHEEL_PATH: dist/${{ steps.build.outputs.wheel_name }}
        run: |
          rc=0
          python scripts/retry_network.py --attempts 3 --delay 10 -- \
            loom validate-wheel "${WHEEL_PATH}" || rc=$?
          case "${rc}" in
            0) failure=none ;;
            75) failure=network ;;
            *) failure=invalid ;;
          esac
          echo "failure=${failure}" >> "$GITHUB_OUTPUT"
          exit "${rc}"
        continue-on-error: true

      - name: Display embedded wheel SBOM validation error
        if: steps.verify_wheel_sbom.outcome == 'success' && steps.validate_wheel_sbom.outcome == 'failure'
        env:
          FAILURE: ${{ steps.validate_wheel_sbom.outputs.failure }}
        run: |
          case "${FAILURE}" in
            network) echo "::error title=Embedded SBOM Validation Network Failure::loom validate-wheel could not download the SPDX schema/context after 3 attempts, so conformance is unknown. Re-run the job." ;;
            invalid) echo "::error title=Embedded SBOM Validation Failed::loom validate-wheel rejected the wheel's embedded SBOM content (schema/SHACL). See the 'Validate embedded wheel SBOM' step's log for the exact reason." ;;
            *) echo "::error title=Embedded SBOM Validation Incomplete::loom validate-wheel did not finish (step timed out or was cancelled). See the 'Validate embedded wheel SBOM' step's log." ;;
          esac

      - name: Generate SBOM
        id: sbom
        if: steps.build.outcome == 'success'
        run: |
          # Get wheel name and create SBOM filename following OpenSSF convention
          WHEEL_NAME="${{ steps.build.outputs.wheel_name }}"
          SBOM_NAME="${WHEEL_NAME}.spdx3.json"

          # Generate SBOM
          loom project . -o "dist/${SBOM_NAME}" --creator-name "Pitloom CI" --creator-email "ci@example.com"

          echo "sbom_name=${SBOM_NAME}" >> "$GITHUB_OUTPUT"
          echo "sbom_path=dist/${SBOM_NAME}" >> "$GITHUB_OUTPUT"
          echo "::notice title=SBOM Generated::Successfully created SBOM file: ${SBOM_NAME}"
        continue-on-error: true

      - name: Display SBOM generation error
        if: steps.build.outcome == 'success' && steps.sbom.outcome == 'failure'
        run: |
          echo "::error title=SBOM Generation Failed::SBOM generation failed for Python ${{ matrix.python-version }}. Verify that the project structure is correct."

      - name: Check SBOM licence
        # Same gate as pypi-publish.yml, which fails a release on it. Like
        # that job, this one has no licenseid database, so the concluded
        # licence must come from CITATION.cff/codemeta.json, not LICENSE
        # text detection -- a PR that drops it fails here, not at release.
        id: license
        if: steps.sbom.outcome == 'success'
        env:
          WHEEL_PATH: dist/${{ steps.build.outputs.wheel_name }}
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          python scripts/check_sbom_license.py --license Apache-2.0 \
            "${WHEEL_PATH}" "${SBOM_PATH}"
        continue-on-error: true

      - name: Display SBOM licence error
        if: steps.sbom.outcome == 'success' && steps.license.outcome == 'failure'
        run: |
          echo "::error title=SBOM Licence Check Failed::The SBOM does not declare and conclude Apache-2.0. See the 'Check SBOM licence' step's log for the reason."

      - name: Validate SBOM with spdx3-validate
        id: validate
        if: steps.sbom.outcome == 'success'
        # Retries sleep 10 s + 30 s; each attempt is capped at 300 s.
        timeout-minutes: 20
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.sbom_path }}
        run: |
          # Determine which URLs to use based on SPDX version
          SPDX_VER="${{ env.SPDX_VERSION }}"

          if [[ "$SPDX_VER" == "3.1" ]]; then
            JSON_SCHEMA_URL="${{ env.SPDX_JSON_SCHEMA_URL_3_1 }}"
            OWL_ONTOLOGY_URL="${{ env.SPDX_OWL_ONTOLOGY_URL_3_1 }}"
            JSONLD_CONTEXT_URL="${{ env.SPDX_JSONLD_CONTEXT_URL_3_1 }}"
            ANNOTATION_URL="${{ env.SPDX_ANNOTATION_URL_3_1 }}"
          else
            # Default to 3.0.1
            JSON_SCHEMA_URL="${{ env.SPDX_JSON_SCHEMA_URL_3_0_1 }}"
            OWL_ONTOLOGY_URL="${{ env.SPDX_OWL_ONTOLOGY_URL_3_0_1 }}"
            JSONLD_CONTEXT_URL="${{ env.SPDX_JSONLD_CONTEXT_URL_3_0_1 }}"
            ANNOTATION_URL="${{ env.SPDX_ANNOTATION_URL_3_0_1 }}"
          fi

          echo "::notice title=Validation Starting::Validating SBOM against SPDX ${SPDX_VER} specification"

          echo "=== SBOM Validation ==="
          echo "SPDX Version: ${SPDX_VER}"
          echo ""
          echo "Validating with spdx3-validate tool against:"
          echo "  - JSON Schema: ${JSON_SCHEMA_URL}"
          echo "  - OWL ontology: ${OWL_ONTOLOGY_URL}"
          echo "  - JSON-LD context: ${JSONLD_CONTEXT_URL}"
          echo "  - Annotation: ${ANNOTATION_URL}"
          echo ""

          # Version auto-detected; --spdx-version is omitted (spdx3-validate
          # 0.0.7 raises AttributeError on args.version). The console
          # entry point, not -m: spdx3-validate's __main__ exits 0 on an
          # invalid document. retry_network.py retries only a network
          # failure and exits 75 when every attempt hit one; that is a
          # failure, never a pass.
          echo "Validating SPDX SBOM (auto-detecting version) for ${SPDX_VER}..."
          rc=0
          python scripts/retry_network.py --attempts 3 --delay 10 -- \
            python -c "import sys; from spdx3_validate.main import main; sys.exit(main())" \
            --json "${SBOM_PATH}" || rc=$?
          case "${rc}" in
            0) failure=none ;;
            75) failure=network ;;
            *) failure=invalid ;;
          esac
          echo "failure=${failure}" >> "$GITHUB_OUTPUT"
          if [ "${rc}" -eq 0 ]; then
            echo "::notice title=Validation Success::SBOM successfully validated against SPDX ${SPDX_VER}"
          fi
          exit "${rc}"
        continue-on-error: true

      - name: Display validation error
        if: steps.sbom.outcome == 'success' && steps.validate.outcome == 'failure'
        env:
          FAILURE: ${{ steps.validate.outputs.failure }}
        run: |
          case "${FAILURE}" in
            network) echo "::error title=Validation Network Failure::spdx3-validate could not download the SPDX schema/context after 3 attempts, so conformance is unknown. Re-run the job." ;;
            invalid) echo "::error title=Validation Failed::SBOM validation failed for Python ${{ matrix.python-version }}. The SBOM does not conform to SPDX specification." ;;
            *) echo "::error title=Validation Incomplete::spdx3-validate did not finish (step timed out or was cancelled). See the 'Validate SBOM with spdx3-validate' step's log." ;;
          esac

      - name: Extract SBOM metadata for summary
        id: metadata
        # Gates on the embedded-wheel checks too, not just spdx3-validate
        # -- otherwise this and "Create failure summary" could both fire,
        # producing a self-contradictory step summary.
        if: |
          steps.validate.outcome == 'success' &&
          steps.verify_wheel_sbom.outcome == 'success' &&
          steps.validate_wheel_sbom.outcome == 'success' &&
          steps.license.outcome == 'success'
        run: |
          python << 'EOF'
          import json
          import os
          from pathlib import Path

          sbom_path = Path("${{ steps.sbom.outputs.sbom_path }}")

          with open(sbom_path, 'r') as f:
              sbom = json.load(f)

          graph = sbom['@graph']

          # Extract CreationInfo
          creation_info = next((e for e in graph if e.get('type') == 'CreationInfo'), {})
          created = creation_info.get('created', 'N/A')
          spec_version = creation_info.get('specVersion', 'N/A')

          # Extract Creator
          creators = [e for e in graph if e.get('type') == 'Person']
          creator_names = [c.get('name', 'Unknown') for c in creators]

          # Extract packages
          packages = [e for e in graph if e.get('type') == 'software_Package']
          main_package = packages[0] if packages else {}

          package_name = main_package.get('name', 'N/A')
          package_version = main_package.get('software_packageVersion', 'N/A')

          # Count dependencies (excluding main package)
          dep_count = len(packages) - 1 if len(packages) > 1 else 0

          # Sample dependencies (up to 5)
          sample_deps = []
          for pkg in packages[1:6]:
              dep_name = pkg.get('name', 'Unknown')
              dep_version = pkg.get('software_packageVersion', '')
              if dep_version:
                  sample_deps.append(f"{dep_name} {dep_version}")
              else:
                  sample_deps.append(dep_name)

          # Write to GitHub output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"created={created}\n")
              f.write(f"spec_version={spec_version}\n")
              f.write(f"creators={', '.join(creator_names)}\n")
              f.write(f"package_name={package_name}\n")
              f.write(f"package_version={package_version}\n")
              f.write(f"dep_count={dep_count}\n")
              f.write(f"sample_deps={', '.join(sample_deps)}\n")
          EOF

      - name: Create Job Summary
        if: |
          steps.validate.outcome == 'success' &&
          steps.verify_wheel_sbom.outcome == 'success' &&
          steps.validate_wheel_sbom.outcome == 'success' &&
          steps.license.outcome == 'success'
        run: |
          # Determine which URLs were used based on SPDX version
          SPDX_VER="${{ env.SPDX_VERSION }}"

          if [[ "$SPDX_VER" == "3.1" ]]; then
            JSON_SCHEMA_URL="${{ env.SPDX_JSON_SCHEMA_URL_3_1 }}"
            OWL_ONTOLOGY_URL="${{ env.SPDX_OWL_ONTOLOGY_URL_3_1 }}"
            JSONLD_CONTEXT_URL="${{ env.SPDX_JSONLD_CONTEXT_URL_3_1 }}"
          else
            # Default to 3.0.1
            JSON_SCHEMA_URL="${{ env.SPDX_JSON_SCHEMA_URL_3_0_1 }}"
            OWL_ONTOLOGY_URL="${{ env.SPDX_OWL_ONTOLOGY_URL_3_0_1 }}"
            JSONLD_CONTEXT_URL="${{ env.SPDX_JSONLD_CONTEXT_URL_3_0_1 }}"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🎉 SBOM Generated Successfully - Python ${{ matrix.python-version }}

          ### 📦 Build Artifacts
          | Artifact | Name |
          | :--- | :--- |
          | Wheel | \`${{ steps.build.outputs.wheel_name }}\` |
          | SBOM | \`${{ steps.sbom.outputs.sbom_name }}\` |

          ### 📋 Creation Metadata
          | Property | Value |
          | :--- | :--- |
          | SPDX Version | ${{ steps.metadata.outputs.spec_version }} |
          | Created | ${{ steps.metadata.outputs.created }} |
          | Creator | ${{ steps.metadata.outputs.creators }} |

          ### 📊 Package Information
          | Property | Value |
          | :--- | :--- |
          | Name | ${{ steps.metadata.outputs.package_name }} |
          | Version | ${{ steps.metadata.outputs.package_version }} |
          | Dependencies | ${{ steps.metadata.outputs.dep_count }} packages |

          ### 🔗 Sample Dependencies
          ${{ steps.metadata.outputs.sample_deps }}

          ### ✅ Validation Status
          | Check | Status | Resource |
          | :--- | :--- | :--- |
          | SPDX Version | ✅ Passed | ${SPDX_VER} |
          | JSON Schema | ✅ Validated | [Schema](${JSON_SCHEMA_URL}) |
          | SHACL | ✅ Validated | [Ontology](${OWL_ONTOLOGY_URL}) |
          | JSON-LD Context | ✅ Validated | [Context](${JSONLD_CONTEXT_URL}) |
          | Licence | ✅ Declared and concluded | Apache-2.0 |
          | Specification | ✅ Conforms | SPDX 3.0 |

          ---

          **Build completed successfully!** 🚀

          EOF

      - name: Create failure summary
        if: |
          always() && (steps.build.outcome == 'failure' ||
          steps.verify_wheel_sbom.outcome == 'failure' ||
          steps.validate_wheel_sbom.outcome == 'failure' ||
          steps.sbom.outcome == 'failure' || steps.validate.outcome == 'failure' ||
          steps.license.outcome == 'failure')
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ❌ Build Failed - Python ${{ matrix.python-version }}

          ### 🔍 Failure Details
          | Step | Status | Description |
          | :--- | :--- | :--- |
          | Build Wheel | ${{ steps.build.outcome == 'failure' && '❌ Failed' || '✅ Passed' }} | ${{ steps.build.outcome == 'failure' && 'Wheel build failed. Check build logs above.' || 'Successfully built wheel.' }} |
          | SBOM Embedded in Wheel | ${{ steps.verify_wheel_sbom.outcome == 'failure' && '❌ Failed' || steps.verify_wheel_sbom.outcome == 'success' && '✅ Passed' || '⊘ Skipped' }} | ${{ steps.verify_wheel_sbom.outcome == 'failure' && 'loom verify-wheel rejected the SBOM (missing, ambiguous, misplaced, or a name/version mismatch) -- see its log for the reason.' || steps.verify_wheel_sbom.outcome == 'success' && 'SBOM found in .dist-info/sboms/, name/version match the wheel.' || 'Skipped due to build failure.' }} |
          | Embedded SBOM Content Valid | ${{ steps.validate_wheel_sbom.outcome == 'failure' && '❌ Failed' || steps.validate_wheel_sbom.outcome == 'success' && '✅ Passed' || '⊘ Skipped' }} | ${{ steps.validate_wheel_sbom.outputs.failure == 'network' && 'Network failure: could not download the SPDX schema/context after 3 attempts; conformance unknown. Re-run the job.' || steps.validate_wheel_sbom.outcome == 'failure' && 'loom validate-wheel rejected the embedded SBOM content (schema/SHACL) -- see its log for the reason.' || steps.validate_wheel_sbom.outcome == 'success' && 'Embedded SBOM content validated.' || 'Skipped due to a previous failure.' }} |
          | Generate SBOM (standalone) | ${{ steps.sbom.outcome == 'failure' && '❌ Failed' || steps.sbom.outcome == 'success' && '✅ Passed' || '⊘ Skipped' }} | ${{ steps.sbom.outcome == 'failure' && 'SBOM generation failed. Verify project structure.' || steps.sbom.outcome == 'success' && 'Successfully generated SBOM.' || 'Skipped due to build failure.' }} |
          | SBOM Licence (Apache-2.0) | ${{ steps.license.outcome == 'failure' && '❌ Failed' || steps.license.outcome == 'success' && '✅ Passed' || '⊘ Skipped' }} | ${{ steps.license.outcome == 'failure' && 'The wheel or standalone SBOM does not declare and conclude Apache-2.0 -- see its log for the reason.' || steps.license.outcome == 'success' && 'Both SBOMs declare and conclude Apache-2.0.' || 'Skipped due to a previous failure.' }} |
          | Validate SBOM (spdx3-validate) | ${{ steps.validate.outcome == 'failure' && '❌ Failed' || steps.validate.outcome == 'success' && '✅ Passed' || '⊘ Skipped' }} | ${{ steps.validate.outputs.failure == 'network' && 'Network failure: could not download the SPDX schema/context after 3 attempts; conformance unknown. Re-run the job.' || steps.validate.outcome == 'failure' && 'SBOM validation failed. SBOM does not conform to SPDX spec.' || steps.validate.outcome == 'success' && 'Successfully validated SBOM.' || 'Skipped due to previous failure.' }} |

          ### 💡 Troubleshooting Tips

          ${{ steps.build.outcome == 'failure' && '**Build Failed:**
          - Check that all dependencies are correctly specified in pyproject.toml
          - Verify Python version compatibility
          - Review build logs for specific error messages
          ' || '' }}

          ${{ steps.sbom.outcome == 'failure' && '**SBOM Generation Failed:**
          - Ensure pyproject.toml exists and is valid
          - Verify that Pitloom is correctly installed
          - Check that project metadata is properly configured
          ' || '' }}

          ${{ steps.license.outcome == 'failure' && '**Licence Check Failed:**
          - The concluded licence comes from CITATION.cff license, else codemeta.json license; it must say Apache-2.0
          - LICENSE text detection is off: CI and the release build have no licenseid database
          - The declared licence comes from pyproject.toml project.license; it must say Apache-2.0 too
          ' || '' }}

          ${{ steps.validate.outcome == 'failure' && steps.validate.outputs.failure != 'network' && '**Validation Failed:**
          - Review the SBOM content for SPDX compliance issues
          - Check that all required SPDX fields are present
          - Verify the SBOM structure matches SPDX 3.0 specification
          ' || '' }}

          ${{ (steps.validate.outputs.failure == 'network' || steps.validate_wheel_sbom.outputs.failure == 'network') && '**Network Failure (not a validation verdict):**
          - The SPDX schema/context download failed on all 3 attempts
          - Re-run the job; the SBOM was not judged either way
          ' || '' }}

          ---

          Please review the logs above for detailed error messages.

          EOF

      - name: Upload wheel artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 3

      - name: Upload SBOM artifact
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.spdx3.json
          retention-days: 3

      - name: Final status check
        if: always()
        run: |
          echo "::group::Final Status Check"
          echo "Checking all workflow steps..."
          echo ""

          BUILD_STATUS="${{ steps.build.outcome }}"
          VERIFY_WHEEL_SBOM_STATUS="${{ steps.verify_wheel_sbom.outcome }}"
          VALIDATE_WHEEL_SBOM_STATUS="${{ steps.validate_wheel_sbom.outcome }}"
          SBOM_STATUS="${{ steps.sbom.outcome }}"
          VALIDATE_STATUS="${{ steps.validate.outcome }}"
          LICENSE_STATUS="${{ steps.license.outcome }}"

          echo "Build: ${BUILD_STATUS}"
          echo "Verify SBOM in wheel: ${VERIFY_WHEEL_SBOM_STATUS}"
          echo "Validate embedded SBOM content: ${VALIDATE_WHEEL_SBOM_STATUS}"
          echo "SBOM (standalone): ${SBOM_STATUS}"
          echo "spdx3-validate: ${VALIDATE_STATUS}"
          echo "SBOM licence: ${LICENSE_STATUS}"
          echo ""
          echo "::endgroup::"

          if [ "$BUILD_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::Build step failed for Python ${{ matrix.python-version }}"
            exit 1
          fi
          if [ "$VERIFY_WHEEL_SBOM_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::Embedded SBOM verification failed for Python ${{ matrix.python-version }}"
            exit 1
          fi
          if [ "$VALIDATE_WHEEL_SBOM_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::Embedded SBOM content validation failed for Python ${{ matrix.python-version }}"
            exit 1
          fi
          if [ "$SBOM_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::SBOM generation step failed for Python ${{ matrix.python-version }}"
            exit 1
          fi
          if [ "$VALIDATE_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::SBOM validation step failed for Python ${{ matrix.python-version }}"
            exit 1
          fi
          if [ "$LICENSE_STATUS" != "success" ]; then
            echo "::error title=Workflow Failed::SBOM licence check failed for Python ${{ matrix.python-version }}"
            exit 1
          fi

          echo "::notice title=Workflow Success::✅ All checks passed for Python ${{ matrix.python-version }}!"
